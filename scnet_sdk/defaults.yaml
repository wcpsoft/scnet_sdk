# =============================================================================
# 类库系统态配置（随包发布，只读）
#
# 本文件由 scnet_sdk.config 在导入时加载，定义接口地址、路径、超时与状态集合
# 等「类库级」默认值。请勿修改本文件：本地覆盖请使用用户态配置
# （./scnet.yaml、~/.config/scnet/scnet.yaml 或 SCNET_CONFIG 指定的文件），
# 环境变量与代码传参的优先级高于本文件。
#
# 优先级（低 -> 高）：
#   代码内置默认值 < 本文件 < 用户态 YAML < SCNET_* 环境变量 < 代码传参
# =============================================================================

# 认证与授权区域接口
endpoints:
  # 获取访问凭证（POST，AK/SK 签名）
  token_url: https://api.scnet.cn/api/user/v3/tokens
  # 获取授权区域（GET，返回 hpcUrls / efileUrls / aiUrls 等）
  center_url: https://www.scnet.cn/ac/openapi/v2/center

# 容器接口路径，拼接在 ai_url（形如 https://<host>/ai）之后
paths:
  resources: /openapi/v2/instance-service/resources
  task: /openapi/v2/instance-service/task
  execute_script: /openapi/v2/instance-service/task/actions/execute-script
  detail: /openapi/v2/instance-service/{container_id}/detail

# 超时（秒）
timeouts:
  # 单次 HTTP 请求超时
  request: 30.0
  # 等待容器进入运行态的总时长上限
  wait: 1800.0
  # 状态轮询间隔
  poll_interval: 5.0

# 容器状态集合（大小写不敏感匹配）
#
# 官方开放 API 文档未给出 status 的完整英文枚举，示例中只出现过 Waiting；
# 控制台帮助文档描述的 6 种状态为：等待 / 部署 / 运行 / 完成 / 失败 / 停止。
# 若线上返回值与下列默认值不同，请在用户态配置中覆盖。
statuses:
  running:
    - running
  terminal:
    - finished
    - complete
    - completed
    - success
    - succeeded
    - failed
    - failure
    - error
    - stopped
    - stop
    - canceled
    - cancelled

# 日志系统（log4j 风格）
#
# 默认不接管输出：不添加 handler，仅向 root logger 传播（propagate），
# 这样宿主框架（uvicorn / FastAPI / Django / Celery ...）的日志配置直接生效。
# 需要独立输出时调用 scnet_sdk.configure_logging() 或在此/用户态配置中开启 console/file。
logging:
  # 包根级别：CRITICAL / ERROR / WARNING / INFO / DEBUG（可用 WARN、FATAL 别名）
  level: WARNING
  # 日志消息语言：内置 zh_CN、en_US；也可用 catalog 指向自定义语言目录
  language: zh_CN
  # 默认格式：text（人读）或 json（结构化，字段化输出，便于采集）
  format: text
  # 是否向 root logger 传播（框架集成的关键开关，一般保持 true）
  propagate: true
  # 是否自动对 token / AK / SK / signature 等敏感字段打码
  mask_secrets: true
  timestamp_format: "%Y-%m-%d %H:%M:%S"
  # 自定义语言包目录或文件（可选），用于扩展/覆盖内置语言
  catalog: null

  # —— 常用输出目标快捷方式（handlers 为空时生效）——
  console: false
  console_stream: stderr      # stdout | stderr
  file: null                  # 例如 logs/scnet.log
  file_max_bytes: 10485760    # 10 MiB 轮转
  file_backup_count: 5

  # —— 完整自定义输出目标（非空时优先于上面的快捷方式）——
  # handlers:
  #   - type: console
  #     format: text
  #     level: INFO
  #     stream: stderr
  #   - type: file
  #     path: logs/scnet.log
  #     format: json
  #     max_bytes: 10485760
  #     backup_count: 5
  handlers: []

  # —— 分级 logger（log4j 的 logger 层级）——
  # loggers:
  #   scnet_sdk.client: DEBUG
  #   scnet_sdk.aclient: DEBUG
  #   scnet_sdk.auth: INFO
  loggers: {}
