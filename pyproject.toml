# SCNet SDK 打包元数据（标准 PEP 621 / setuptools 布局）
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scnet-sdk"
version = "0.4.0"
description = "SCNet 开放 API 容器能力 Python SDK（同步 + 异步：创建 / 状态查询 / 执行脚本 / 删除；log4j 风格多语言日志）"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["scnet", "hpc", "container", "openapi", "sdk"]
classifiers = [
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Documentation = "https://www.scnet.cn/ac/openapi/doc/2.0/api/tutorials.html"

[tool.setuptools]
packages = ["scnet_sdk"]
include-package-data = true

[tool.setuptools.package-data]
scnet_sdk = ["defaults.yaml", "locales/*.yaml"]
